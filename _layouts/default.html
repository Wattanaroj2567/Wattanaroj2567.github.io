<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ใช้ GitHub Avatar เป็น favicon -->
    <link rel="icon" href="https://avatars.githubusercontent.com/u/159878664?v=4" type="image/png">

    <!-- CSS หลักของธีม Cayman -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">

    <!-- CSS เพิ่มเติมของเราเอง ให้ดูอ่านง่ายขึ้น -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            line-height: 1.8;
        }

        .page-header {
            padding: 40px 20px;
        }

        .project-name {
            font-size: 2.4rem;
            margin-bottom: 0.4rem;
        }

        .project-tagline {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            max-width: 900px;
            margin: 0 auto 40px;
            padding: 24px 28px;
            background: #0f172a;
            /* พื้นหลังกล่องเนื้อหา */
            border-radius: 12px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        }

        .main-content h1,
        .main-content h2,
        .main-content h3 {
            color: #f9fafb;
            margin-top: 1.4em;
            margin-bottom: 0.5em;
        }

        .main-content p,
        .main-content li {
            font-size: 16px;
            color: #e5e7eb;
        }

        .main-content hr {
            border: 0;
            border-top: 1px solid #1f2937;
            margin: 24px 0;
        }

        .main-content a {
            color: #38bdf8;
            text-decoration: none;
        }

        .main-content a:hover {
            text-decoration: underline;
        }

        /* ตารางแผนการสอนให้อ่านง่ายขึ้น */
        .main-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0 24px;
            font-size: 14px;
        }

        .main-content th,
        .main-content td {
            border: 1px solid #1f2937;
            padding: 8px 10px;
            vertical-align: top;
        }

        .main-content thead th {
            background: #111827;
            color: #e5e7eb;
        }

        .main-content tbody tr:nth-child(even) {
            background: #020617;
        }

        .main-content tbody tr:nth-child(odd) {
            background: #02061740;
        }
    </style>
</head>

<body>
    <section class="page-header">
        <h1 class="project-name">{{ site.title }}</h1>
        <h2 class="project-tagline">{{ site.description }}</h2>
        <a href="https://github.com/Wattanaroj2567" class="btn">View on GitHub</a>
    </section>

    <section class="main-content">
        {{ content }}
    </section>
</body>

</html>
